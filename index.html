<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gato Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #FBF6EC;
    --papel-marcado: #F1E9D8;
    --tinta: #2C2620;
    --tinta-suave: #6B6155;
    --x-color: #4C3B8C;
    --o-color: #D9822B;
    --turno: #2F8F6E;
    --error: #B4472F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--papel); color: var(--tinta);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }
  .page {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; gap: 20px; text-align: center;
  }
  .titulo {
    position: relative;
    display: inline-block;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 2.4rem;
    margin: 0 0 4px 0;
    color: var(--tinta);
    letter-spacing: 0.5px;
  }
  .titulo::before, .titulo::after {
    content: "";
    position: absolute;
    top: -14px;
    width: 0; height: 0;
    border-left: 11px solid transparent;
    border-right: 11px solid transparent;
    border-bottom: 20px solid var(--tinta);
  }
  .titulo::before { left: -6px; transform: rotate(-18deg); }
  .titulo::after { right: -6px; transform: rotate(18deg); }
  .subtitulo {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    color: var(--tinta-suave);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin: 0 0 8px 0;
  }
  .card {
    background: var(--papel-marcado);
    border: 2px solid var(--tinta);
    border-radius: 20px; padding: 28px;
    width: 100%; max-width: 380px; display: flex; flex-direction: column;
    gap: 16px;
    box-shadow: 4px 4px 0 var(--tinta);
  }
  input {
    background: var(--papel); border: 2px solid var(--tinta); border-radius: 10px;
    padding: 12px; color: var(--tinta); font-size: 1.1rem; text-align: center;
    text-transform: uppercase; letter-spacing: 3px; width: 100%;
    font-family: 'Baloo 2', sans-serif; font-weight: 700;
  }
  input::placeholder { color: var(--tinta-suave); letter-spacing: 2px; }
  input:focus { outline: 3px solid var(--turno); outline-offset: 1px; }
  button {
    background: var(--x-color); border: 2px solid var(--tinta); border-radius: 999px;
    padding: 13px 18px;
    color: var(--papel); font-size: 1rem; font-family: 'Inter', sans-serif; font-weight: 700;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--tinta);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  button:hover:not(:disabled) { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--tinta); }
  button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--tinta); }
  button:disabled { background: #D8D0C0; color: var(--tinta-suave); border-color: #D8D0C0; box-shadow: none; cursor: not-allowed; }
  button.secundario { background: var(--papel); color: var(--tinta); }
  button:focus-visible { outline: 3px solid var(--turno); outline-offset: 2px; }
  .divisor { display: flex; align-items: center; gap: 12px; color: var(--tinta-suave); font-size: 0.8rem; letter-spacing: 1px; }
  .divisor::before, .divisor::after { content: ""; flex: 1; height: 2px; background: var(--tinta-suave); opacity: 0.35; }
  .error {
    color: var(--error); font-size: 0.9rem; font-weight: 600;
    background: #F4E3DD; border: 1px solid var(--error); border-radius: 10px; padding: 8px 12px;
  }
  .codigo-sala {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.7rem; font-weight: 700; letter-spacing: 6px;
    background: var(--papel); border-radius: 10px; padding: 8px 18px;
    border: 2px dashed var(--tinta);
  }
  .tablero {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    width: 100%; max-width: 300px;
    background: var(--tinta); padding: 6px; border-radius: 16px;
    border: 2px solid var(--tinta);
  }
  .celda {
    aspect-ratio: 1; background: var(--papel); border: none; border-radius: 10px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 2.6rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--tinta); padding: 0;
    box-shadow: none;
  }
  .celda:hover:not(:disabled) { background: #FFFDF7; transform: none; }
  .celda:disabled { cursor: default; }
  .celda.x { color: var(--x-color); }
  .celda.o { color: var(--o-color); }
  .insignia {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 0.95rem;
    padding: 8px 16px; border-radius: 999px;
    border: 2px solid var(--tinta);
    background: var(--papel-marcado);
  }
  .insignia.turno-propio { background: var(--turno); color: var(--papel); border-color: var(--turno); }
  .insignia.ganaste { background: var(--turno); color: var(--papel); border-color: var(--turno); }
  .insignia.perdiste { background: #EADFCB; }
  .marca-jugador { font-size: 0.85rem; color: var(--tinta-suave); }
  .marca-jugador b { color: var(--tinta); font-family: 'Baloo 2', sans-serif; }
  .compartir { display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>

<div id="app"></div>

<!-- Librería de Supabase, cargada directo desde internet, sin instalar nada -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
// ======= CONFIGURACIÓN DE SUPABASE =======
// El "anon key" está pensado para usarse directo en el navegador, es seguro.
const SUPABASE_URL = "https://hdqumnjjihaasvpvegvp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkcXVtbmpqaWhhYXN2cHZlZ3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjk4MTcsImV4cCI6MjEwNDY0NTgxN30.a0rJq9Xp6LuI2T6VRu7xXPY-Ukj6YrDQSy8a4MhMQdg";

const cliente = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ======= UTILIDADES DEL JUEGO =======
const ALFABETO = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function generarCodigoSala(longitud = 5) {
  let codigo = "";
  for (let i = 0; i < longitud; i++) {
    codigo += ALFABETO[Math.floor(Math.random() * ALFABETO.length)];
  }
  return codigo;
}

function generarIdJugador() {
  return "p_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function tableroVacio() {
  return ["", "", "", "", "", "", "", "", ""];
}

const LINEAS_GANADORAS = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6],
];

function calcularGanador(board) {
  for (const [a,b,c] of LINEAS_GANADORAS) {
    if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
  }
  if (board.every((c) => c !== "")) return "empate";
  return null;
}

// ======= ESTADO GLOBAL =======
let canalActivo = null;
const app = document.getElementById("app");

// ======= VISTA: INICIO (crear / unirse) =======
function mostrarInicio(mensajeError) {
  if (canalActivo) { cliente.removeChannel(canalActivo); canalActivo = null; }

  app.innerHTML = `
    <main class="page">
      <div>
        <h1 class="titulo">Gato</h1>
        <p class="subtitulo">Partida online · 1 contra 1</p>
      </div>
      <div class="card">
        <button id="btn-crear">Crear sala nueva</button>
        <div class="divisor">o si ya tienes un código</div>
        <form id="form-unirse" style="display:flex; flex-direction:column; gap:12px;">
          <input id="input-codigo" placeholder="Código de sala" maxlength="8" />
          <button type="submit" class="secundario">Unirse con código</button>
        </form>
        ${mensajeError ? `<p class="error">${mensajeError}</p>` : ""}
      </div>
    </main>
  `;

  document.getElementById("btn-crear").addEventListener("click", crearSala);
  document.getElementById("form-unirse").addEventListener("submit", (e) => {
    e.preventDefault();
    const codigo = document.getElementById("input-codigo").value.trim().toUpperCase();
    unirseSala(codigo);
  });
}

async function crearSala() {
  const codigo = generarCodigoSala();
  const idJugador = generarIdJugador();

  const { error } = await cliente.from("games").insert({
    id: codigo,
    board: tableroVacio(),
    turn: "X",
    player_x: idJugador,
    player_o: null,
    status: "esperando",
    winner: null,
  });

  if (error) {
    console.error(error);
    mostrarInicio("No se pudo crear la sala. Intenta de nuevo.");
    return;
  }

  localStorage.setItem(`gato:${codigo}:idJugador`, idJugador);
  localStorage.setItem(`gato:${codigo}:rol`, "X");
  history.pushState({}, "", `?sala=${codigo}`);
  mostrarSala(codigo, idJugador, "X");
}

async function unirseSala(codigo) {
  if (!codigo || codigo.length < 4) {
    mostrarInicio("Ingresa un código válido.");
    return;
  }

  const { data: sala, error } = await cliente
    .from("games")
    .select("*")
    .eq("id", codigo)
    .maybeSingle();

  if (error) {
    console.error(error);
    mostrarInicio("Ocurrió un error al buscar la sala.");
    return;
  }

  if (!sala) {
    mostrarInicio("No existe una sala con ese código.");
    return;
  }

  const idGuardado = localStorage.getItem(`gato:${codigo}:idJugador`);
  if (idGuardado && (idGuardado === sala.player_x || idGuardado === sala.player_o)) {
    const rolGuardado = localStorage.getItem(`gato:${codigo}:rol`);
    history.pushState({}, "", `?sala=${codigo}`);
    mostrarSala(codigo, idGuardado, rolGuardado);
    return;
  }

  if (sala.status !== "esperando" || sala.player_o) {
    mostrarInicio("Esa sala ya está llena o en juego.");
    return;
  }

  const idJugador = generarIdJugador();
  const { error: errorUpdate } = await cliente
    .from("games")
    .update({ player_o: idJugador, status: "jugando" })
    .eq("id", codigo)
    .eq("status", "esperando");

  if (errorUpdate) {
    console.error(errorUpdate);
    mostrarInicio("Ocurrió un error al unirse a la sala.");
    return;
  }

  localStorage.setItem(`gato:${codigo}:idJugador`, idJugador);
  localStorage.setItem(`gato:${codigo}:rol`, "O");
  history.pushState({}, "", `?sala=${codigo}`);
  mostrarSala(codigo, idJugador, "O");
}

// ======= VISTA: SALA DE JUEGO =======
async function mostrarSala(codigo, idJugador, rol) {
  const { data: sala, error } = await cliente
    .from("games")
    .select("*")
    .eq("id", codigo)
    .maybeSingle();

  if (error || !sala) {
    mostrarInicio("Esta sala no existe.");
    history.pushState({}, "", window.location.pathname);
    return;
  }

  renderSala(sala, rol, codigo);

  if (canalActivo) cliente.removeChannel(canalActivo);
  canalActivo = cliente
    .channel(`sala-${codigo}`)
    .on(
      "postgres_changes",
      { event: "UPDATE", schema: "public", table: "games", filter: `id=eq.${codigo}` },
      (payload) => renderSala(payload.new, rol, codigo)
    )
    .subscribe();
}

function renderSala(sala, rol, codigo) {
  let mensajeEstado = "";
  let claseInsignia = "";
  if (sala.status === "esperando") {
    mensajeEstado = "Esperando al otro jugador…";
  } else if (sala.status === "jugando") {
    mensajeEstado = sala.turn === rol ? "Tu turno" : "Turno del rival";
    claseInsignia = sala.turn === rol ? "turno-propio" : "";
  } else if (sala.status === "terminado") {
    if (sala.winner === "empate") { mensajeEstado = "¡Empate!"; }
    else if (sala.winner === rol) { mensajeEstado = "¡Ganaste!"; claseInsignia = "ganaste"; }
    else { mensajeEstado = "Perdiste"; claseInsignia = "perdiste"; }
  }

  app.innerHTML = `
    <main class="page">
      <h1 class="titulo">Gato</h1>
      <div class="compartir">
        <span class="codigo-sala">${codigo}</span>
        <button class="secundario" id="btn-copiar">Copiar código</button>
      </div>
      <p class="marca-jugador">Juegas como <b>${rol}</b></p>
      <span class="insignia ${claseInsignia}">${mensajeEstado}</span>
      <div class="tablero">
        ${sala.board.map((celda, i) => `
          <button
            class="celda ${celda === "X" ? "x" : celda === "O" ? "o" : ""}"
            data-indice="${i}"
            ${(sala.status !== "jugando" || sala.turn !== rol || celda !== "") ? "disabled" : ""}
          >${celda}</button>
        `).join("")}
      </div>
      ${sala.status === "terminado" ? `<button id="btn-reiniciar">Jugar otra vez</button>` : ""}
      <button class="secundario" id="btn-salir">Salir</button>
    </main>
  `;

  document.getElementById("btn-copiar").addEventListener("click", () => {
    navigator.clipboard.writeText(codigo);
  });

  document.getElementById("btn-salir").addEventListener("click", () => {
    history.pushState({}, "", window.location.pathname);
    mostrarInicio();
  });

  const btnReiniciar = document.getElementById("btn-reiniciar");
  if (btnReiniciar) {
    btnReiniciar.addEventListener("click", async () => {
      await cliente.from("games").update({
        board: tableroVacio(), turn: "X", status: "jugando", winner: null,
      }).eq("id", codigo);
    });
  }

  document.querySelectorAll(".celda").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const indice = parseInt(btn.dataset.indice, 10);
      const nuevoTablero = [...sala.board];
      nuevoTablero[indice] = rol;
      const ganador = calcularGanador(nuevoTablero);

      await cliente.from("games").update({
        board: nuevoTablero,
        turn: rol === "X" ? "O" : "X",
        status: ganador ? "terminado" : "jugando",
        winner: ganador,
      }).eq("id", codigo);
    });
  });
}

// ======= ARRANQUE =======
(function iniciar() {
  const params = new URLSearchParams(window.location.search);
  const codigoEnUrl = params.get("sala");

  if (codigoEnUrl) {
    const codigo = codigoEnUrl.toUpperCase();
    const idGuardado = localStorage.getItem(`gato:${codigo}:idJugador`);
    const rolGuardado = localStorage.getItem(`gato:${codigo}:rol`);
    if (idGuardado && rolGuardado) {
      mostrarSala(codigo, idGuardado, rolGuardado);
      return;
    }
  }
  mostrarInicio();
})();
</script>

</body>
</html>
